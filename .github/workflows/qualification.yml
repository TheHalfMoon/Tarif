name: Tarif Qualification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  qualification:
    name: qualification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch for formatting repair
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Verify exact diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Verify canonical governance surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          required = [
              "AGENTS.md", "CONSTITUTION.md", "CONTRIBUTING.md", "SECURITY.md", "LICENSE",
              "docs/execution-master-plan.md", "docs/threat-model.md", "docs/tcb.md",
              "docs/coverage-contract.md", "specs/CURRENT.md",
          ]
          missing = [path for path in required if not Path(path).is_file()]
          if missing:
              raise SystemExit("missing canonical files: " + ", ".join(missing))
          current = Path("specs/CURRENT.md").read_text(encoding="utf-8")
          if "Issue #3" not in current:
              raise SystemExit("specs/CURRENT.md must preserve the live R3 enforcement blocker")
          PY

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.0
          rustc --version | grep -F "rustc 1.98.0"

      - name: Verify committed dependency lock
        run: cargo metadata --locked --format-version 1 >/dev/null

      - name: Apply pinned rustfmt
        run: cargo fmt --all

      - name: Rust clippy on formatted tree
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests on formatted tree
        run: cargo test --workspace --all-targets --locked

      - name: Rust doc tests on formatted tree
        run: cargo test --workspace --doc --locked

      - name: Commit exact rustfmt output to implementation branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- crates/tarif-core; then
            echo "No rustfmt changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/tarif-core
          git commit -m "style(002): apply pinned Rust 1.98 rustfmt to corpus"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
